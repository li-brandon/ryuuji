name: macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PROJECT: Ryuuji.xcodeproj
  SCHEME: Ryuuji
  DESTINATION: platform=macOS
  DERIVED_DATA: DerivedData
  RESULTS_DIR: TestResults
  XCODE_VERSION: '27'

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27  # public-preview macOS 27 image; deployment target is macOS 27.0
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select Xcode
        run: |
          XCODE_VERSION="${XCODE_VERSION:-27}"
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          else
            XCODE_APP="$(ls -d /Applications/Xcode_"${XCODE_VERSION}"*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No /Applications/Xcode_${XCODE_VERSION}*.app found; keeping default $(xcode-select -p)"
          fi

          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if [ "$XCODE_MAJOR" != "$XCODE_VERSION" ]; then
            echo "::error title=Wrong Xcode::Expected Xcode ${XCODE_VERSION}.x but got Xcode ${XCODE_MAJOR:-unknown} at $(xcode-select -p)"
            exit 1
          fi
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"
          sw_vers

      - name: Cache Swift packages
        if: hashFiles('**/Package.resolved') != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Prepare secrets config
        run: |
          if [ ! -f Config/Secrets.xcconfig ]; then
            cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          fi

      - name: Build for testing
        run: |
          mkdir -p "$RESULTS_DIR"
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/build.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/test.xcresult" \
            -only-testing:RyuujiTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
